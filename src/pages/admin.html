<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración | Los Pollos Hermanos</title>
    <link rel="stylesheet" href="/src/css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Estilos específicos para el panel de administración */
        .admin-container { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
        .tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; border-bottom: 2px solid #ccc; }
        .tab-btn { padding: 0.8rem 1.5rem; border: none; background: #f0f0f0; cursor: pointer; font-weight: bold; border-radius: 8px 8px 0 0; }
        .tab-btn.active { background: #E50914; color: white; }
        .crud-panel { display: none; background: white; padding: 1.5rem; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .crud-panel.active { display: block; }
        .admin-table { width: 100%; border-collapse: collapse; margin-top: 1.5rem; }
        .admin-table th, .admin-table td { padding: 0.75rem; border: 1px solid #ddd; text-align: left; }
        .admin-table th { background-color: #333; color: white; }
        .btn-action { padding: 0.3rem 0.6rem; border: none; border-radius: 4px; cursor: pointer; margin-right: 0.2rem; }
        .btn-edit { background: #ffc107; color: #000; }
        .btn-delete { background: #dc3545; color: white; }
    </style>
</head>
<body>
    <header class="navbar">
        <div class="logo-container">
            <h1 class="brand-title">Panel Admin - Los Pollos Hermanos</h1>
        </div>
        <nav>
            <ul class="nav-links">
                <li><a href="/index.html">← Volver a la Web</a></li>
            </ul>
        </nav>
    </header>

    <main class="admin-container">
        <!-- Navegación por pestañas para los 3 CRUDs -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('crud-productos')">1. CRUD Productos</button>
            <button class="tab-btn" onclick="switchTab('crud-categorias')">2. CRUD Categorías</button>
            <button class="tab-btn" onclick="switchTab('crud-pedidos')">3. CRUD Pedidos</button>
        </div>

        <!-- ==================== CRUD 1: PRODUCTOS ==================== -->
        <section id="crud-productos" class="crud-panel active">
            <h2>Gestión de Productos (Menú)</h2>
            <form id="formProductoAdmin" class="contact-form" style="max-width: 100%;">
                <input type="hidden" id="prodId">
                <div class="form-group">
                    <label for="pNombre">Nombre:</label>
                    <input type="text" id="pNombre" required placeholder="Ej. Combo Familiar">
                </div>
                <div class="form-group">
                    <label for="pPrecio">Precio (S/):</label>
                    <input type="number" step="0.01" id="pPrecio" required placeholder="24.90">
                </div>
                <div class="form-group">
                    <label for="pImagen">URL Imagen (opcional):</label>
                    <input type="url" id="pImagen" placeholder="https://ejemplo.com/imagen.jpg">
                </div>
                <div class="form-group">
                    <label for="pDescripcion">Descripción:</label>
                    <textarea id="pDescripcion" rows="2" required placeholder="Detalle del plato..."></textarea>
                </div>
                <button type="submit" id="btnGuardarProd" class="btn-submit">Guardar / Actualizar Producto</button>
            </form>

            <table class="admin-table">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Precio</th>
                        <th>Descripción</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tbodyProductos"></tbody>
            </table>
        </section>

        <!-- ==================== CRUD 2: CATEGORÍAS ==================== -->
        <section id="crud-categorias" class="crud-panel">
            <h2>Gestión de Categorías</h2>
            <form id="formCatAdmin" class="contact-form" style="max-width: 100%;">
                <input type="hidden" id="catId">
                <div class="form-group">
                    <label for="cNombre">Nombre de la Categoría:</label>
                    <input type="text" id="cNombre" required placeholder="Ej. Combos, Bebidas, Postres">
                </div>
                <button type="submit" class="btn-submit">Guardar Categoría</button>
            </form>

            <table class="admin-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre de Categoría</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tbodyCategorias"></tbody>
            </table>
        </section>

        <!-- ==================== CRUD 3: PEDIDOS ==================== -->
        <section id="crud-pedidos" class="crud-panel">
            <h2>Pedidos Recibidos</h2>
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Cliente</th>
                        <th>Email</th>
                        <th>Detalle del Pedido</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tbodyPedidos"></tbody>
            </table>
        </section>
    </main>

    <script type="module" src="/src/js/admin.js"></script>
    <script>
        // Cambio de pestañas simple
        function switchTab(tabId) {
            document.querySelectorAll('.crud-panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
        }
    </script>
</body>
</html>
